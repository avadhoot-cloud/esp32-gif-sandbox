; ESP32 GIF/Serial sandbox — isolated from StatusBar repo
;
; Upload/Build in VS Code use only default_envs unless you pass -e other_env.
; Optional per-PC port: copy platformio_local.ini.example → platformio_local.ini

[platformio]
default_envs = esp32

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
extra_scripts = pre:scripts/pio_upload_port.py

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=-1
    -D TFT_DC=4
    -D TFT_RST=2
    -D SUPPORT_TRANSACTIONS
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SANDBOX_SERIAL_BAUD=115200

; Exact Arduino sketch — only TFT_eSPI, pins from include/User_Setup.h (Generic ESP32 ST7789)
[env:esp32_tft_test]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:scripts/pio_upload_port.py
lib_deps = bodmer/TFT_eSPI @ ^2.5.43
build_src_filter = +<main.cpp> -<main_sandbox.cpp>
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h

; Breadboard photo wiring (if test env shows blank, try: pio run -e esp32_tft_photo -t upload)
[env:esp32_tft_photo]
extends = env:esp32_tft_test
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_CS=-1
    -D TFT_MOSI=25
    -D TFT_SCLK=14
    -D TFT_DC=27
    -D TFT_RST=12
    -D TFT_BL=13
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_FREQUENCY=27000000

[env:esp32]
extends = env
build_src_filter = +<main_sandbox.cpp> -<main.cpp>
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000

; Same as esp32 but USB serial at 921600 (match only if host also uses 921600)
[env:esp32_baud921]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D SANDBOX_SERIAL_BAUD=921600
monitor_speed = 921600

[env:esp32_spi20]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=16000000

[env:esp32_spi27]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000

[env:esp32_spi40]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
